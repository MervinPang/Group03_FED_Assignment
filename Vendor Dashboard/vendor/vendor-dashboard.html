<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendor Dashboard - Hawker Hub</title>
    <link rel="stylesheet" href="vendor-dashboard.css" />
  </head>
  <body>
    <!-- Vendor Dashboard Container -->
    <section class="vendor-dashboard-container">
      <!-- Header Section -->
      <header class="vendor-dashboard-header">
        <hgroup class="vendor-stall-info">
          <h2 class="vendor-stall-name">Stall Name(Hawker Centre)</h2>
          <p id="vendor-stall-id">Stall Unit no.</p>
        </hgroup>
        <nav class="vendor-dashboard-top-right">
          <button class="vendor-btn-home" onclick="navigateHome()">
            <span class="vendor-btn-icon">🏠</span>
            <span class="vendor-btn-text">Home</span>
          </button>
        </nav>
      </header>

      <!-- Stats Cards Section-->
      <ul class="vendor-stats-container">
        <li class="vendor-stats-card">
          <figure class="vendor-stat-icon" style="background: #3b82f6">
            📦
          </figure>
          <article class="vendor-stat-content">
            <p class="vendor-stat-label">Today's Orders</p>
            <h3 class="vendor-stat-value" id="vendor-orders-today">0</h3>
          </article>
        </li>
        <li class="vendor-stat-card">
          <figure class="vendor-stat-icon" style="background: #10b981">
            💵
          </figure>
          <article class="vendor-stat-content">
            <p class="vendor-stat-label">Today's Revenue</p>
            <h3 class="vendor-stat-value" id="vendor-total-orders">$0.00</h3>
          </article>
        </li>
        <li class="vendor-stat-card">
          <figure class="vendor-stat-icon" style="background: #f59e0b">
            ⏱
          </figure>
          <article class="vendor-stat-content">
            <p class="vendor-stat-label">Active Orders</p>
            <h3 class="vendor-stat-value" id="vendor-active-orders">0</h3>
          </article>
        </li>
        <li class="vendor-stat-card">
          <figure class="vendor-stat-icon" style="background: #a78bfa">
            ⭐
          </figure>
          <article class="vendor-stat-content">
            <p class="vendor-stat-label">Avg Rating</p>
            <h3 class="vendor-stat-value" id="vendor-avg-rating">5.0</h3>
          </article>
        </li>
      </ul>

      <!-- Tab Navigation-->
      <nav class="vendor-tab-navigation">
        <button class="vendor-tab-btn-active" data-vendor-tab="overview">
          Overview
        </button>
        <button class="vendor-tab-btn" data-vendor-tab="orders">Orders</button>
        <button class="vendor-tab-btn" data-vendor-tab="menu">Menu</button>
        <button class="vendor-tab-btn" data-vendor-tab="reviews">
          Reviews
        </button>
        <button class="vendor-tab-btn" data-vendor-tab="history">
          History
        </button>
        <button class="vendor-tab-btn" data-vendor-tab="rental">Rental</button>
      </nav>
    </section>
  </body>
</html>

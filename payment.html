<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Mervin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link href="global.css" rel="stylesheet" type="text/css">
    <link href="payment.css" rel="stylesheet" type="text/css">
</head>

<body>
    <header class="navigation-bar">
        <nav class="nav">
            <img class="nav-logo" src="images/HawkerHubSG Logo.png" alt="HawkerHubSG Logo Image">
            <p class="name">HawkerHubSG</p>
            <div class="link">
                <a class="button" href="index.html">Home</a>
                <a class="button active" href="order.html">Orders</a>
                <a class="button" href="profile.html">Profile</a>
            </div>
        </nav>
    </header>
    <main class="container payment-layout">
        <section class="payment-card">
            <h2 class="title">Scan this QR code to pay</h2>
            <div class="qr-box">
                <img class="qr-img" src="images/PayNow QR Code.png" alt="PayNow QR Code Picture">
            </div>
            <p class="payment-note">
                Use your banking app to scan and complete payment.
            </p>
            <a class="paid-button" href="confirmation.html">Once paid, click here!</a>
        </section>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation - Mervin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link href="global.css" rel="stylesheet" type="text/css">
    <link href="confirmation.css" rel="stylesheet" type="text/css">
</head>

<body>
    <header class="navigation-bar">
        <nav class="nav">
            <img class="nav-logo" src="images/HawkerHubSG Logo.png" alt="HawkerHubSG Logo Image">
            <p class="name">HawkerHubSG</p>
            <div class="navigation-link">
                <a class="button" href="index.html">Home</a>
                <a class="button" href="order.html">Orders</a>
                <a class="button" href="profile.html">Profile</a>
            </div>
        </nav>
    </header>
    <div class="container confirm-layout">
        <section class="confirm">
            <div class="tick-icon">
                <img src="images/Tick Icon.svg" alt="Tick Icon">
            </div>
            <h2 id="confirmTitle" class="title">Order Confirmed!</h2>
            <p id="confirmSubtitle" class="subtitle">Thank you for your order</p>
            <hr class="divider">
            <p class="order">Your Order Number</p>
            <p id="orderNumber" class="order-number">67</p>
            <a id="confirmAction" class="browse-button" href="index.html">Continue Browsing</a>
        </section>
    </div>
    <script type="module" src="confirmation.js"></script>
</body>

</html>

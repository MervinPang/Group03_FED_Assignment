<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - Mervin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link href="global.css" rel="stylesheet" type="text/css">
    <link href="order-history.css" rel="stylesheet" type="text/css">
</head>

<body>
    <header class="navigation-bar">
        <nav class="nav">
            <img class="nav-logo" src="images/HawkerHubSG Logo.png" alt="HawkerHubSG Logo Image">
            <p class="name">HawkerHubSG</p>

            <div class="navigation-link">
                <a class="button" href="index.html">Home</a>
                <a class="button active" href="order.html">Orders</a>
                <a class="button" href="profile.html">Profile</a>
            </div>
        </nav>
    </header>
    <div class="container order-history-layout">
        <h2 class="page-title">Your Orders</h2>

        <div class="tabs">
            <button id="activeTab" class="tab active" type="button">Active (<span id="activeCount">0</span>)</button>
            <button id="pastTab" class="tab" type="button">Past Orders (<span id="pastCount">0</span>)</button>
        </div>

        <section id="activeOrdersSection" class="orders-section">
            <div id="activeOrderList" class="order-list"></div>

            <p id="activeEmptyMessage" class="empty-message" hidden>
                You have no active orders.
            </p>
        </section>

        <section id="pastOrdersSection" class="orders-section" hidden>
            <div id="pastOrderList" class="order-list"></div>

            <p id="pastEmptyMessage" class="empty-message" hidden>
                You have no past orders.
            </p>
        </section>

        <a class="purchase-button" href="index.html">Make Another Purchase</a>
    </div>
    <script src="order-history.js"></script>
</body>

</html>
